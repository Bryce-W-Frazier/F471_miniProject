name: Build Snake Game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: snake-linux
            output: snake-linux
          - os: windows-latest
            artifact: snake-windows
            output: snake-windows.exe
          - os: macos-latest
            artifact: snake-macos
            output: snake-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pygame pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ${{ matrix.artifact }} game_loop.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output == 'snake-windows.exe' && 'snake-windows.exe' || matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: snake-*
          path: downloads
          merge-multiple: true

      - name: Commit downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if ! git diff --cached --quiet; then
            git commit -m "Update Snake game downloads"
            git push
          fi
